name: daily-email-digest

on:
  schedule:
    - cron: "0 1,13 * * *" # 09:00 and 21:00 Asia/Taipei (UTC+8)
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job
        env:
          WORK_GMAIL_CLIENT_ID: ${{ secrets.WORK_GMAIL_CLIENT_ID }}
          WORK_GMAIL_CLIENT_SECRET: ${{ secrets.WORK_GMAIL_CLIENT_SECRET }}
          WORK_GMAIL_REFRESH_TOKEN: ${{ secrets.WORK_GMAIL_REFRESH_TOKEN }}
          PERSONAL_GMAIL_CLIENT_ID: ${{ secrets.PERSONAL_GMAIL_CLIENT_ID }}
          PERSONAL_GMAIL_CLIENT_SECRET: ${{ secrets.PERSONAL_GMAIL_CLIENT_SECRET }}
          PERSONAL_GMAIL_REFRESH_TOKEN: ${{ secrets.PERSONAL_GMAIL_REFRESH_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
        run: python -m src.main run
