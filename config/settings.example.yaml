timezone: Asia/Taipei
run_times:
- '09:00'
- '21:00'
move_mode: moderate
labels:
  archive_label: Auto/LowPriority
  review_label: Auto/Review
  newsletter_label: Auto/Newsletter
whitelist_senders: []
priority_keywords:
- 付款
- 驗證碼
- 合約
- invoice
- security alert
newsletter_sources:
- newsletter@substack.com
spam_scan:
  enabled: true
  action: report_only
digest:
  redaction_mode: strict
  channels:
  - gmail
  gmail:
    to: your-email@example.com
  slack:
    channel_id: ''
  line:
    enabled: false
accounts:
- id: work
  display_name: Work Mail
  env_prefix: WORK
  enabled: true
  digest_to: your-email@example.com
  overrides: {}
- id: personal
  display_name: Personal Mail
  env_prefix: PERSONAL
  enabled: true
  overrides: {}
exclude_important_senders:
- '@channels.com.tw'
exclude_important_subject_keywords: []
force_newsletter_senders: []
force_newsletter_subject_keywords: []
scoring:
  keep_threshold: 3
  move_threshold: -3
  newsletter_threshold: 3
