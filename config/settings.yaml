timezone: Asia/Taipei
run_times:
- '12:00'
- '20:00'
move_mode: moderate
labels:
  archive_label: Auto/LowPriority
  review_label: Auto/Review
  newsletter_label: Auto/Newsletter
whitelist_senders:
- boss@company.com
- '@important-client.com'
- ns@synologynotification.com
priority_keywords:
- 付款
- 驗證碼
- 合約
- 客戶
- invoice
- security alert
newsletter_sources:
- newsletter@substack.com
spam_scan:
  enabled: true
  action: report_only
digest:
  redaction_mode: balanced
  channels:
  - gmail
  - line
  gmail:
    to: your-address@gmail.com
  slack:
    channel_id: C0123456789
  line:
    enabled: true
accounts:
- id: work
  display_name: Work Mail
  env_prefix: WORK
  enabled: true
  digest_to: your-address@gmail.com
  overrides:
    whitelist_senders:
    - ceo@company.com
- id: personal
  display_name: Personal Mail
  env_prefix: PERSONAL
  enabled: true
  overrides:
    newsletter_sources:
    - newsletter@substack.com
    - service@vocus.cc
    - support@johntool.com
    - service@tnf.org.tw
exclude_important_senders:
- '@channels.com.tw'
exclude_important_subject_keywords: []
force_newsletter_senders: []
force_newsletter_subject_keywords: []
scoring:
  keep_threshold: 3
  move_threshold: -3
  newsletter_threshold: 3
